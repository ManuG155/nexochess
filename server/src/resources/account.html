<!DOCTYPE html>
<html lang="${LANG}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>${SUBJECT}</title>
</head>
<body style="margin:0;background:#f1f2f4;padding:0;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
        ${PREHEADER}
    </div>

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f1f2f4;">
        <tr>
            <td align="center" style="padding:28px 14px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#17191d;border-radius:14px;overflow:hidden;border:1px solid #2d3138;">
                    <tr>
                        <td align="center" style="padding:28px 28px 18px;background:#111318;">
                            <img src="cid:nexochess-logo" alt="NexoChess" width="210" style="display:block;width:210px;max-width:80%;height:auto;border:0;" />
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:0 28px 24px;background:#111318;font-family:Arial,sans-serif;color:#aeb5c0;font-size:14px;line-height:1.5;">
                            ${TAGLINE}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:34px 34px 12px;font-family:Arial,sans-serif;color:#f5f7fa;font-size:24px;font-weight:700;line-height:1.3;text-align:center;">
                            ${SUBJECT}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:8px 34px 24px;font-family:Arial,sans-serif;color:#d3d7de;font-size:16px;line-height:1.65;text-align:center;">
                            ${MESSAGE}
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:4px 34px 28px;">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td align="center" bgcolor="#467de8" style="border-radius:8px;">
                                        <a href="${VERIFICATION_URL}" target="_blank" style="display:inline-block;padding:14px 24px;font-family:Arial,sans-serif;font-size:16px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">
                                            ${BUTTON_LABEL}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 34px 28px;font-family:Arial,sans-serif;color:#9ea5af;font-size:13px;line-height:1.6;text-align:center;">
                            ${SECURITY_NOTE}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:22px 28px;border-top:1px solid #2d3138;background:#14161a;font-family:Arial,sans-serif;color:#8f96a1;font-size:12px;line-height:1.65;text-align:center;">
                            ${AUTOMATED_NOTICE}<br />
                            <a href="mailto:${CONTACT_ADDRESS}" style="color:#a9c5ff;text-decoration:none;">${CONTACT_ADDRESS}</a><br />
                            Copyright © ${COPYRIGHT_YEAR} NexoChess
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
