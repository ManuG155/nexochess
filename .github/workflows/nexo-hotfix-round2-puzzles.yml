name: NexoChess hotfix round 2 - puzzles

on:
  push:
    branches:
      - fix/v1.1-core-hotfix-round2
    paths:
      - .github/workflows/nexo-hotfix-round2-puzzles.yml

permissions:
  contents: write

jobs:
  patch-puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-core-hotfix-round2

      - name: Patch persistent evaluation and manual arrows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'client/src/apps/features/puzzles/pages/Puzzles/index.tsx';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(label, before, after) {
            if (!source.includes(before)) {
              throw new Error(`Missing expected block: ${label}`);
            }
            source = source.replace(before, after);
          }

          replaceOnce(
            'react chessboard arrow type import',
            'import { Chessboard } from "react-chessboard";\n',
            'import { Chessboard } from "react-chessboard";\nimport { Arrow } from "react-chessboard/dist/chessboard/types";\n'
          );

          replaceOnce(
            'manual arrow state',
            `    const [ hintArrow, setHintArrow ] =\n        useState<NonNullable<\n            React.ComponentProps<typeof Chessboard>["customArrows"]\n        >>([]);\n`,
            `    const [ hintArrow, setHintArrow ] =\n        useState<NonNullable<\n            React.ComponentProps<typeof Chessboard>["customArrows"]\n        >>([]);\n    const [ manualArrows, setManualArrows ] =\n        useState<Arrow[]>([]);\n`
          );

          replaceOnce(
            'persistent engine refs',
            `    const evaluationCacheRef = useRef(new Map<string, Evaluation>());\n    const evaluationRequestRef = useRef(0);\n`,
            `    const evaluationCacheRef = useRef(new Map<string, Evaluation>());\n    const evaluationRequestRef = useRef(0);\n    const evaluationEngineRef = useRef<Engine>();\n    const evaluationEngineVersionRef = useRef<EngineVersion>();\n`
          );

          replaceOnce(
            'reset manual arrows on puzzle start',
            `        setHintArrow([]);\n        setPendingReply(false);\n`,
            `        setHintArrow([]);\n        setManualArrows([]);\n        setPendingReply(false);\n`
          );

          const effectStart = source.indexOf('    useEffect(() => {\n        if (!puzzle || !currentFen) return;\n\n        const requestId = ++evaluationRequestRef.current;');
          if (effectStart < 0) throw new Error('Missing puzzle evaluation effect start');
          const effectEndMarker = `    }, [\n        currentFen,\n        puzzle?.id,\n        settings.analysis.engine.depth,\n        settings.analysis.engine.version\n    ]);\n`;
          const effectEndStart = source.indexOf(effectEndMarker, effectStart);
          if (effectEndStart < 0) throw new Error('Missing puzzle evaluation effect end');
          const effectEnd = effectEndStart + effectEndMarker.length;

          const replacementEffect = `    useEffect(() => () => {\n        evaluationRequestRef.current++;\n        evaluationEngineRef.current?.terminate();\n        evaluationEngineRef.current = undefined;\n        evaluationEngineVersionRef.current = undefined;\n    }, []);\n\n    useEffect(() => {\n        if (!puzzle || !currentFen) return;\n\n        const requestId = ++evaluationRequestRef.current;\n        const updateEvaluation = (evaluation: Evaluation) => {\n            if (requestId != evaluationRequestRef.current) return;\n\n            evaluationCacheRef.current.set(currentFen, evaluation);\n            setBoardEvaluation({ ...evaluation });\n        };\n\n        if (\n            puzzle.source == "archive"\n            && currentFen == puzzle.startFen\n        ) {\n            updateEvaluation(puzzle.evaluation);\n            return;\n        }\n\n        const provisionalEvaluation =\n            getProvisionalEvaluation(currentFen);\n        const cachedEvaluation =\n            evaluationCacheRef.current.get(currentFen);\n\n        if (cachedEvaluation) {\n            setBoardEvaluation({ ...cachedEvaluation });\n        }\n\n        const selectedVersion = settings.analysis.engine.version;\n        const localVersion = selectedVersion == EngineVersion.LICHESS_CLOUD\n            ? EngineVersion.STOCKFISH_17_LITE\n            : selectedVersion;\n\n        if (\n            !evaluationEngineRef.current\n            || evaluationEngineVersionRef.current != localVersion\n        ) {\n            evaluationEngineRef.current?.terminate();\n            evaluationEngineRef.current = new Engine(localVersion);\n            evaluationEngineVersionRef.current = localVersion;\n        }\n\n        const engine = evaluationEngineRef.current;\n        let cancelled = false;\n\n        void (async () => {\n            try {\n                /*\n                 * Reutilizamos el mismo Stockfish durante toda la sesión.\n                 * Al cambiar de FEN detenemos la búsqueda anterior y lanzamos\n                 * la nueva; así la barra recibe líneas reales desde las\n                 * primeras profundidades en lugar de recrear un Worker en\n                 * cada movimiento.\n                 */\n                await engine.stopEvaluation();\n                if (\n                    cancelled\n                    || requestId != evaluationRequestRef.current\n                ) return;\n\n                engine\n                    .setThreadCount(1)\n                    .setLineCount(1)\n                    .setPosition(currentFen);\n\n                const lines = await engine.evaluate({\n                    depth: Math.min(\n                        16,\n                        Math.max(10, settings.analysis.engine.depth)\n                    ),\n                    timeLimit: 900,\n                    onEngineLine: line => {\n                        if (\n                            !cancelled\n                            && requestId == evaluationRequestRef.current\n                            && line.index == 1\n                            && line.depth >= 1\n                        ) {\n                            updateEvaluation(line.evaluation);\n                        }\n                    }\n                });\n\n                const finalLine = lines\n                    .filter(line => line.index == 1)\n                    .at(-1);\n\n                if (\n                    !cancelled\n                    && requestId == evaluationRequestRef.current\n                    && finalLine\n                ) {\n                    updateEvaluation(finalLine.evaluation);\n                }\n            } catch {\n                if (\n                    !cancelled\n                    && requestId == evaluationRequestRef.current\n                ) {\n                    setBoardEvaluation({ ...provisionalEvaluation });\n                }\n            }\n        })();\n\n        return () => {\n            cancelled = true;\n        };\n    }, [\n        currentFen,\n        puzzle?.id,\n        settings.analysis.engine.depth,\n        settings.analysis.engine.version\n    ]);\n`;

          source = source.slice(0, effectStart) + replacementEffect + source.slice(effectEnd);

          replaceOnce(
            'manual arrow capture props',
            `                                onSquareClick={selectBoardSquare}\n                                customPieces={customPieces}\n`,
            `                                onSquareClick={selectBoardSquare}\n                                customArrowColor="rgba(0,0,0,0)"\n                                onArrowsChange={setManualArrows}\n                                customPieces={customPieces}\n`
          );

          replaceOnce(
            'dynamic evaluation move colour',
            `                            moveColour={\n                                puzzle.solver == "white"\n                                    ? PieceColour.WHITE\n                                    : PieceColour.BLACK\n                            }\n`,
            `                            moveColour={\n                                new Chess(currentFen).turn() == "w"\n                                    ? PieceColour.WHITE\n                                    : PieceColour.BLACK\n                            }\n`
          );

          replaceOnce(
            'combined hint and manual arrow overlay',
            `                            {hintArrow.length > 0 && (\n                                <SuggestionArrowOverlay\n                                    arrows={hintArrow.map(arrow => ({\n                                        from: arrow[0],\n                                        to: arrow[1],\n                                        colour: String(\n                                            arrow[2] || "#78a7ff"\n                                        )\n                                    }))}\n                                    flipped={\n                                        puzzleBoardOrientation == "black"\n                                    }\n                                />\n                            )}\n`,
            `                            {(\n                                hintArrow.length > 0\n                                || manualArrows.length > 0\n                            ) && (\n                                <SuggestionArrowOverlay\n                                    arrows={[\n                                        ...hintArrow.map(arrow => ({\n                                            from: arrow[0],\n                                            to: arrow[1],\n                                            colour: String(\n                                                arrow[2] || "#78a7ff"\n                                            )\n                                        })),\n                                        ...manualArrows.map(([from, to]) => ({\n                                            from,\n                                            to,\n                                            colour: "#78a7ff"\n                                        }))\n                                    ]}\n                                    flipped={\n                                        puzzleBoardOrientation == "black"\n                                    }\n                                />\n                            )}\n`
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Commit focused puzzle fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/apps/features/puzzles/pages/Puzzles/index.tsx
          git commit -m "Hotfix: reactiva evaluación y flechas manuales en Puzzles"
          git push origin HEAD:fix/v1.1-core-hotfix-round2
