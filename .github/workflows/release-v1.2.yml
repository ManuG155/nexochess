name: Release v1.2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish v1.2
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify master matches develop
        run: |
          git fetch origin develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)" || {
            echo "Refusing to publish v1.2 because master and develop are not aligned."
            exit 1
          }

      - name: Create v1.2 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --tags origin refs/tags/v1.2 >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.2 "$GITHUB_SHA" -m "NexoChess v1.2"
            git push origin refs/tags/v1.2
          fi

          if gh release view v1.2 >/dev/null 2>&1; then
            echo "GitHub release v1.2 already exists."
            exit 0
          fi

          gh release create v1.2 \
            --verify-tag \
            --title "NexoChess v1.2" \
            --notes-file docs/releases/v1.2.md
