name: Repertoire Lock Refresh Temp

on:
  push:
    branches:
      - feat/repertoire-ux-final-pass

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/repertoire-ux-final-pass
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh dependency lock
        run: npm audit fix --package-lock-only --audit-level=high
      - name: Commit refreshed lock when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Security: refresh vulnerable transitive dependency lock"
          git push origin HEAD:feat/repertoire-ux-final-pass
