name: Publish NexoChess v1.1

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-v1.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish v1.1 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: b78d4d78e5b28534ffe774aea4028ca3c2376405
        run: |
          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v1.1 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "NexoChess v1.1" \
            --notes-file docs/releases/v1.1.md \
            --latest
