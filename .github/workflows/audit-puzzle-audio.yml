name: Audit puzzle audio

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/show-full-game-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate audio assets and usage
        shell: bash
        run: |
          echo '=== AUDIO ASSETS ==='
          find client -type f \( -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.wav' -o -iname '*.m4a' \) -print | sort || true
          echo '=== AUDIO REFERENCES ==='
          grep -RniE "new Audio|AudioContext|\.mp3|\.ogg|\.wav|playSound|sound" client/src client/public --exclude='*.map' | head -n 800 || true
