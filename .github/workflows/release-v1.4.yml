name: Release v1.4

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish v1.4
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify master content matches develop
        run: |
          git fetch origin develop
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse origin/develop^{tree})" || {
            echo "Refusing to publish v1.4 because master and develop do not contain the same tree."
            exit 1
          }

      - name: Refresh repository About metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY" \
            -f description='Free, open-source chess analysis and learning platform with Stockfish review, puzzles, lessons, repertoire, endgames and statistics. No login required.' \
            -f homepage='https://www.nexochess.com/'
          repo_status=$?

          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/topics" \
            -f 'names[]=nexochess' \
            -f 'names[]=chess' \
            -f 'names[]=stockfish' \
            -f 'names[]=chess-analysis' \
            -f 'names[]=chess-puzzles' \
            -f 'names[]=chess-training' \
            -f 'names[]=chess-lessons' \
            -f 'names[]=react' \
            -f 'names[]=typescript' \
            -f 'names[]=cloudflare-workers' \
            -f 'names[]=open-source'
          topics_status=$?

          if [ "$repo_status" -ne 0 ] || [ "$topics_status" -ne 0 ]; then
            echo '::warning::The GitHub Actions token could not update one or more repository About fields. Tagging and release publication will continue.'
          fi

          exit 0

      - name: Create or correct v1.4 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 172456dee0d569584f6339c6c8e95f0312dca56f
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin --tags --force
          git cat-file -e "$RELEASE_SHA^{commit}"

          current_tag_sha=""
          if git rev-parse -q --verify 'refs/tags/v1.4^{}' >/dev/null 2>&1; then
            current_tag_sha="$(git rev-parse 'refs/tags/v1.4^{}')"
          fi

          if [ "$current_tag_sha" != "$RELEASE_SHA" ]; then
            echo "Correcting v1.4 tag from ${current_tag_sha:-missing} to $RELEASE_SHA."
            git tag -fa v1.4 "$RELEASE_SHA" -m "NexoChess v1.4"
            git push --force origin refs/tags/v1.4
          else
            echo "v1.4 tag already points to the final production release commit."
          fi

          if gh release view v1.4 >/dev/null 2>&1; then
            gh release edit v1.4 \
              --title "NexoChess v1.4" \
              --notes-file docs/releases/v1.4.md
          else
            gh release create v1.4 \
              --verify-tag \
              --title "NexoChess v1.4" \
              --notes-file docs/releases/v1.4.md
          fi
