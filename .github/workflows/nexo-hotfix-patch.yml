name: NexoChess hotfix patch

on:
  push:
    branches:
      - fix/v1.1-core-analysis-puzzles
    paths:
      - .github/workflows/nexo-hotfix-patch.yml

permissions:
  contents: write

jobs:
  patch-puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-core-analysis-puzzles

      - name: Patch puzzle evaluation and arrows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const puzzlePath = 'client/src/apps/features/puzzles/pages/Puzzles/index.tsx';
          let source = fs.readFileSync(puzzlePath, 'utf8');

          function replaceOnce(label, before, after) {
            if (!source.includes(before)) {
              throw new Error(`Missing expected block: ${label}`);
            }
            source = source.replace(before, after);
          }

          replaceOnce(
            'arrow overlay import',
            'import EvaluationBar from\n    "@analysis/components/EvaluationBar";\n',
            'import EvaluationBar from\n    "@analysis/components/EvaluationBar";\nimport SuggestionArrowOverlay from\n    "@analysis/components/Board/SuggestionArrowOverlay";\n'
          );

          replaceOnce(
            'provisional evaluation reset',
            `        const provisionalEvaluation =\n            getProvisionalEvaluation(currentFen);\n        const cachedEvaluation =\n            evaluationCacheRef.current.get(currentFen);\n\n        setBoardEvaluation(\n            cachedEvaluation\n                ? { ...cachedEvaluation }\n                : { ...provisionalEvaluation }\n        );\n`,
            `        const provisionalEvaluation =\n            getProvisionalEvaluation(currentFen);\n        const cachedEvaluation =\n            evaluationCacheRef.current.get(currentFen);\n\n        /*\n         * No sustituimos una evaluación válida por 0.0/material mientras\n         * Stockfish arranca para la siguiente posición. Si ya conocemos esta\n         * FEN usamos la caché; si no, mantenemos la lectura anterior hasta la\n         * primera línea real del motor.\n         */\n        if (cachedEvaluation) {\n            setBoardEvaluation({ ...cachedEvaluation });\n        }\n`
          );

          replaceOnce(
            'early engine update',
            '                    && line.depth >= 6\n',
            '                    && line.depth >= 4\n'
          );

          replaceOnce(
            'straight react chessboard arrows',
            '                                customArrows={hintArrow}\n                                customArrowColor="#78a7ff"\n',
            ''
          );

          replaceOnce(
            'puzzle arrow overlay',
            `                            />\n\n                            {settings.themes.board.coordinates == "outside" && (\n`,
            `                            />\n\n                            {hintArrow.length > 0 && (\n                                <SuggestionArrowOverlay\n                                    arrows={hintArrow.map(arrow => ({\n                                        from: arrow[0],\n                                        to: arrow[1],\n                                        colour: String(\n                                            arrow[2] || "#78a7ff"\n                                        )\n                                    }))}\n                                    flipped={\n                                        puzzleBoardOrientation == "black"\n                                    }\n                                />\n                            )}\n\n                            {settings.themes.board.coordinates == "outside" && (\n`
          );

          fs.writeFileSync(puzzlePath, source);

          const cssPath = 'client/src/apps/features/puzzles/pages/Puzzles/Puzzles.module.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const oldCss = `.evaluationBar {\n    width: 17px;\n    min-width: 17px;\n    margin-right: 8px;\n}\n\n.boardStageWithOutsideCoordinates .evaluationBar {\n    margin-right: 16px;\n}\n\n.boardShell {\n    position: relative;\n    width: calc(100% - 25px);\n    aspect-ratio: 1;\n}\n\n.boardStageWithOutsideCoordinates .boardShell {\n    width: calc(100% - 33px);\n}\n`;
          const newCss = `.evaluationBar {\n    width: 26px;\n    min-width: 26px;\n    margin-right: 10px;\n}\n\n.boardStageWithOutsideCoordinates .evaluationBar {\n    margin-right: 18px;\n}\n\n.boardShell {\n    position: relative;\n    flex: 1 1 auto;\n    min-width: 0;\n    width: auto;\n    aspect-ratio: 1;\n}\n\n.boardStageWithOutsideCoordinates .boardShell {\n    width: auto;\n}\n`;
          if (!css.includes(oldCss)) {
            throw new Error('Missing expected puzzle evaluation bar CSS block');
          }
          css = css.replace(oldCss, newCss);
          fs.writeFileSync(cssPath, css);
          NODE

      - name: Commit focused patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/apps/features/puzzles/pages/Puzzles/index.tsx client/src/apps/features/puzzles/pages/Puzzles/Puzzles.module.css
          git commit -m "Hotfix: dinamiza la evaluación y flechas de Puzzles"
          git push origin HEAD:fix/v1.1-core-analysis-puzzles
