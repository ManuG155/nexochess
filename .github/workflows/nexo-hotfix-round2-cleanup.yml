name: NexoChess hotfix round 2 cleanup

on:
  push:
    branches:
      - fix/v1.1-core-hotfix-round2
    paths:
      - .github/workflows/nexo-hotfix-round2-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-core-hotfix-round2

      - name: Remove one-use hotfix workflows
        shell: bash
        run: |
          rm -f .github/workflows/nexo-hotfix-round2-puzzles.yml
          rm -f .github/workflows/nexo-hotfix-round2-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "Hotfix: retira automatizaciones temporales"
          git push origin HEAD:fix/v1.1-core-hotfix-round2
