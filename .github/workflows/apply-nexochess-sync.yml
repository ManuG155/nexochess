name: Apply NexoChess ZIP sync

on:
  push:
    branches:
      - agent/show-full-game-importer
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/show-full-game-importer
          fetch-depth: 0

      - name: Detect synchronization payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.nexochess-sync/part-*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct audited source archive
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .nexochess-sync/part-* | wc -c)" -eq 98748
          cat .nexochess-sync/part-* | base64 --decode > /tmp/nexochess-sync.tar.gz
          echo "50b1debcf485f007128cc16bda849645a2fd4ccd24ea3945f2848706d763f30e  /tmp/nexochess-sync.tar.gz" | sha256sum -c -

      - name: Apply latest local project files
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/nexochess-sync.tar.gz -C .
          rm -f client/src/components/layout/PageWrapper/NavigationActiveState.module.css
          rm -rf .nexochess-sync
          rm -f SYNC-MANIFEST.txt

      - name: Run repository audits
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-translations.mjs
          node scripts/check-repository.mjs
          node scripts/check-puzzle-backend.mjs
          git diff --check
          if find . -type f \( -name '*.zst' -o -name 'lichess_db_puzzle.csv' -o -name '*.puzzle-db.csv' -o -name '*.puzzle-db.csv.zst' \) -print -quit | grep -q .; then
            echo 'A full puzzle database file was found in the repository.' >&2
            exit 1
          fi

      - name: Commit synchronized changes
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexoChess Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(puzzles): complete localization and restore layout [nexochess-sync-applied]'
          git push origin HEAD:agent/show-full-game-importer
