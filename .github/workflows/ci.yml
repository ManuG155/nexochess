name: CI

on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main, develop, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit translations
        run: npm run check:translations

      - name: Audit repository contents
        run: npm run check:repository

      - name: Verify account email templates
        run: npm run verify:account-email

      - name: Type-check client
        run: npm run check -w client

      - name: Type-check server
        run: npm run check -w server

      - name: Build production bundles
        run: npm run build

      - name: Validate Cloudflare and export scripts
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/auth.mjs
          node --check cloudflare/api.mjs
          node --check cloudflare/email.mjs
          node --check scripts/build-cloudflare.mjs
          node --check scripts/export-puzzles-static.mjs
          node --check scripts/prepare-cloudflare-production.mjs
          node --check scripts/verify-cloudflare-production.mjs
          node --check scripts/verify-puzzle-data.mjs
          node --check scripts/verify-account-email.mjs

      - name: Prepare staging Cloudflare assets
        run: node scripts/build-cloudflare.mjs

      - name: Bundle staging Cloudflare Worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run

      - name: Prepare production Cloudflare assets
        run: node scripts/build-cloudflare.mjs --puzzle-origin https://nexochess-puzzle-data-production.manuel-garcia-villaescusa.workers.dev

      - name: Bundle production Cloudflare Worker
        run: |
          node scripts/prepare-cloudflare-production.mjs \
            --database-id 00000000-0000-4000-8000-000000000000
          npx --yes wrangler@4 deploy \
            --dry-run \
            --config wrangler.production.local.jsonc \
            --outdir .wrangler-production-dry-run
