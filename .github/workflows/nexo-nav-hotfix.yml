name: NexoChess nav hotfix

on:
  push:
    branches:
      - fix/v1.1-followup-functional
    paths:
      - .github/workflows/nexo-nav-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-followup-functional
      - name: Preserve canonical Analysis link and intercept clicks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'client/src/components/layout/NavigationBar/index.tsx';
          let s = fs.readFileSync(path, 'utf8');

          s = s.replace(
            '    onClick?: React.MouseEventHandler<HTMLAnchorElement>;\n',
            ''
          );
          s = s.replace(
            'function NavigationItem({ children, current = false, icon, url, onClick }: NavigationItemProps) {',
            'function NavigationItem({ children, current = false, icon, url }: NavigationItemProps) {'
          );
          s = s.replace('        onClick={onClick}\n', '');

          const oldFn = `    function openAnalysis(event: React.MouseEvent<HTMLAnchorElement>) {\n        if (\n            event.defaultPrevented\n            || event.button != 0\n            || event.metaKey\n            || event.ctrlKey\n            || event.shiftKey\n            || event.altKey\n        ) return;\n\n        event.preventDefault();\n        window.location.assign(currentLanguageHref("/analysis?nexo-nav=1"));\n    }\n\n`;
          if (!s.includes(oldFn)) throw new Error('openAnalysis block not found');
          s = s.replace(oldFn, '');

          const anchor = `    useEffect(() => {\n        if (status == "success") {\n            completePendingAuthAnalytics(true);\n        } else if (status == "error") {\n            completePendingAuthAnalytics(false);\n        }\n    }, [status]);\n\n`;
          if (!s.includes(anchor)) throw new Error('analytics effect anchor not found');
          s = s.replace(anchor, anchor + `    useEffect(() => {\n        function interceptAnalysisNavigation(event: MouseEvent) {\n            if (\n                event.defaultPrevented\n                || event.button != 0\n                || event.metaKey\n                || event.ctrlKey\n                || event.shiftKey\n                || event.altKey\n            ) return;\n\n            const target = event.target;\n            if (!(target instanceof Element)) return;\n\n            const link = target.closest<HTMLAnchorElement>("a[href]");\n            if (!link || link.origin != window.location.origin) return;\n\n            if (\n                parseLanguagePathname(link.pathname).basePathname\n                != "/analysis"\n            ) return;\n\n            event.preventDefault();\n            window.location.assign(\n                currentLanguageHref("/analysis?nexo-nav=1")\n            );\n        }\n\n        document.addEventListener(\n            "click",\n            interceptAnalysisNavigation,\n            true\n        );\n\n        return () => document.removeEventListener(\n            "click",\n            interceptAnalysisNavigation,\n            true\n        );\n    }, []);\n\n`);

          s = s.replace(
            '<NavigationItem icon="analysis" url="/analysis" current={onAnalysisPage} onClick={openAnalysis}>',
            '<NavigationItem icon="analysis" url="/analysis" current={onAnalysisPage}>'
          );

          fs.writeFileSync(path, s);
          NODE
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/layout/NavigationBar/index.tsx
          git commit -m "Hotfix: conserva enlace canónico y blinda acceso a Analysis"
          git push origin HEAD:fix/v1.1-followup-functional
