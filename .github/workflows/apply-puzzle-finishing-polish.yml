name: Apply puzzle finishing polish

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/show-full-game-importer'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-full-game-importer
          fetch-depth: 0

      - name: Detect completed patch
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[puzzle-finishing-polish-applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply polish
        if: steps.guard.outputs.skip == 'false'
        run: python3 .github/scripts/apply-puzzle-finishing-polish.py

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Verify
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          npm run check:translations
          npm run check:repository
          npm run check -w client
          npm run check -w server
          npm run build
          git diff --check

      - name: Commit
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name 'NexoChess UI'
          git config user.email 'actions@users.noreply.github.com'
          git add client/src/apps/features/puzzles/pages/Puzzles/index.tsx
          git add client/src/apps/features/puzzles/pages/Puzzles/Puzzles.module.css
          git commit -m 'feat(puzzles): finish workspace metrics and feedback [puzzle-finishing-polish-applied]'
          git push origin HEAD:agent/show-full-game-importer
