name: Apply navigation puzzle flip

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect completed patch
        id: detect
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[navigation-puzzle-flip-applied\]'; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch
        if: steps.detect.outputs.done != 'true'
        run: python .github/scripts/apply-navigation-puzzle-flip.py

      - name: Install dependencies
        if: steps.detect.outputs.done != 'true'
        run: npm ci

      - name: Verify
        if: steps.detect.outputs.done != 'true'
        run: |
          npm run check:translations
          npm run check:repository
          npm run check -w client
          npm run check -w server
          npm run build
          git diff --check

      - name: Commit
        if: steps.detect.outputs.done != 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/layout/NavigationBar/index.tsx \
                  client/src/apps/features/puzzles/pages/Puzzles/index.tsx
          git commit -m "fix(navigation): expose puzzle flip and hide archive actions [navigation-puzzle-flip-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
