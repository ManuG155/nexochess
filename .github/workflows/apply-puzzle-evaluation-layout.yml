name: Apply puzzle evaluation and layout polish

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/show-full-game-importer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Detect completed patch
        id: detect
        shell: bash
        run: |
          if grep -q 'NEXO_PUZZLE_EVALUATION_LAYOUT_POLISH' client/src/apps/features/puzzles/pages/Puzzles/Puzzles.module.css; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch
        if: steps.detect.outputs.applied == 'false'
        run: python .github/scripts/apply-puzzle-evaluation-layout.py

      - name: Install dependencies
        if: steps.detect.outputs.applied == 'false'
        run: npm ci

      - name: Verify
        if: steps.detect.outputs.applied == 'false'
        run: npm run verify

      - name: Commit
        if: steps.detect.outputs.applied == 'false'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/apps/features/puzzles/pages/Puzzles/index.tsx client/src/apps/features/puzzles/pages/Puzzles/Puzzles.module.css client/src/apps/features/analysis/components/EvaluationBar/EvaluationBar.module.css client/src/components/layout/NavigationBar/NavigationBar.module.css
          git commit -m 'fix(puzzles): refresh evaluation and consolidate position metadata [puzzle-eval-layout-applied]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
